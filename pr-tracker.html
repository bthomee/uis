  /* Split on commas too, so pasting an old comma-separated list still works. */
  const parts = input.value.split(/[,\n]/).map(x => x.trim().replace(/^@/, '')).filter(Boolean);
  input.value = '';
  if (!parts.length) return;
  const list = denyList();
  const seen = new Set(list.map(normLogin));
  let added = false;
  parts.forEach(name => {
    const k = normLogin(name);
    if (!k || seen.has(k)) return;      // normLogin ignores a [bot] suffix, so
    seen.add(k);                        // "copilot" and "copilot[bot]" are one
    list.push(name);
    added = true;
  });
  if (!added) { paintDenyChips(refocus); return; }
  setDenyList(list);
  paintDenyChips(refocus);
  applyDenylistNow();
}

function removeDeny(login) {
  setDenyList(denyList().filter(l => l !== login));
  paintDenyChips(true);
  applyDenylistNow();
}

function paintDenyChips(refocus) {
  const box = document.getElementById('deny-field');
  if (!box) return;
  const list = denyList();
  box.innerHTML = '';

  const wrap = document.createElement('span');
  wrap.className = 'gh-token-inputwrap';
  const input = document.createElement('input');
  input.className = 'gh-token-input';
  input.type = 'text';
  input.spellcheck = false;
  input.autocomplete = 'off';
  input.setAttribute('list', 'deny-suggestions');
  input.setAttribute('aria-label', 'Add a reviewer to ignore');
  input.placeholder = 'Ignore a reviewer - e.g. some-bot[bot]';
  input.title = 'GitHub logins to leave out of the reviewer column. The [bot] suffix is optional.';
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addDeny(input, true); return; }
    /* Backspace on an empty box removes the last chip, as in the filter bar. */
    if (e.key === 'Backspace' && !input.value && list.length) {
      e.preventDefault();
      removeDeny(list[list.length - 1]);
    }
  });
  input.addEventListener('blur', () => addDeny(input, false));
  wrap.appendChild(input);
  box.appendChild(wrap);
  if (refocus) input.focus();

  list.forEach(login => {
    const chip = document.createElement('span');
    chip.className = 'gh-token is-exclude';
    const x = document.createElement('button');
    x.className = 'gh-token-x';
    x.type = 'button';
    x.textContent = '×';
    x.title = `Stop ignoring ${login}`;
    x.setAttribute('aria-label', `Stop ignoring ${login}`);
    x.addEventListener('click', () => removeDeny(login));
    const text = document.createElement('span');
    text.textContent = login;
    chip.append(x, text);
    box.appendChild(chip);
  });

  paintDenySuggestions();
}

/* Offer reviewers actually seen in the fetched data. Anyone already ignored is
   filtered out, and teams (@name) are not reviewers you can ignore by login. */
function paintDenySuggestions() {
  const dl = document.getElementById('deny-suggestions');
  if (!dl) return;
  const have = new Set(denyList().map(normLogin));
  dl.innerHTML = '';
  observedValues('reviewer')
    .filter(v => !v.startsWith('@') && !have.has(normLogin(v)))
    .slice(0, 200)
    .forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      dl.appendChild(o);
    });
}

/* Only the selected choice's field is editable, so a value can never sit in a
   box that nothing reads. */
function markRangeInputs() {
  const oB = document.getElementById('opt-baseline');
  const oD = document.getElementById('opt-days');
  if (!oB || !oD) return;
  oB.disabled = config.range !== 'baseline';
  oD.disabled = config.range !== 'days';
  RANGES.forEach(v => {
    const el = document.getElementById('rng-' + v);
    if (el) el.classList.toggle('is-off', config.range !== v);
  });
}

function buildWatchRow(watch, index) {
  const row = document.createElement('div');
  row.className = 'watch-row';

  const refs = { gen: { repos: 0, branches: 0 }, busy: '', err: '' };
  rowUi[index] = refs;

  const orgCombo = new Combobox({
    placeholder: 'Owner or organization',
    onChange: v => {
      watch.org = v.trim();
      watch.repo = ''; watch.branch = '';
      refs.repoCombo.setValue(''); refs.repoCombo.setOptions([]);
      refs.branchCombo.setValue(''); refs.branchCombo.setOptions([]); refs.branchCombo.setDisabled(true);
      saveConfig();
      if (watch.org) loadRepos(index, watch, refs);
      else { refs.err = ''; refs.busy = ''; paintRowNote(refs); }
    },
  });

  const repoCombo = new Combobox({
    placeholder: 'Repository',
    onChange: v => {
      watch.repo = v.trim();
      watch.branch = '';
      refs.branchCombo.setValue('');
      saveConfig();
      if (watch.org && watch.repo) loadBranches(index, watch, refs);
      else { refs.branchCombo.setOptions([]); refs.branchCombo.setDisabled(true); }
    },
  });

  const branchCombo = new Combobox({
    placeholder: 'Base branch',
    disabled: !watch.repo,
    onChange: v => { watch.branch = v.trim(); saveConfig(); },
  });

  refs.orgCombo = orgCombo;
  refs.repoCombo = repoCombo;
  refs.branchCombo = branchCombo;

  orgCombo.setOptions(app.orgs);
  orgCombo.setValue(watch.org);
  repoCombo.setValue(watch.repo);
  branchCombo.setValue(watch.branch);
  branchCombo.setDisabled(false);

  [orgCombo, repoCombo, branchCombo].forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.appendChild(c.el);
    row.appendChild(cell);
  });

  const del = document.createElement('button');
  del.className = 'btn-del';
  del.textContent = '✕';
  del.title = 'Stop watching';
  del.addEventListener('click', () => {
    config.watches.splice(index, 1);
    if (!config.watches.length) config.watches.push({ org: '', repo: '', branch: '' });
    /* Drop the removed rows from `results` too. Only `refreshAll` used to
       rebuild it, so a deleted repository kept feeding the stats bar and the CSV
       export: the board would say "Nothing being watched yet" while the numbers
       above it still counted the repository that had just gone, and Export CSV
       would still write its rows out. */
    pruneResults();
    saveConfig();
    paintConfig();
    paintResults();
    paintToolbar();
  });
  row.appendChild(del);

  refs.note = document.createElement('div');
  refs.note.className = 'row-note';
  row.appendChild(refs.note);

  /* Populate the dropdowns for a row restored from config/URL, without
     clobbering the values already in it. */
  if (watch.org) loadRepos(index, watch, refs, true);
  if (watch.org && watch.repo) loadBranches(index, watch, refs, true);

  return row;
}

function paintRowNote(refs) {
  if (!refs.note) return;
  refs.note.innerHTML = '';
  if (refs.err) {
    refs.note.style.color = '#f87171';
    refs.note.textContent = '⚠ ' + refs.err;
  } else if (refs.busy) {
    refs.note.style.color = 'var(--text-mute)';
    refs.note.innerHTML = `<span class="pulse-dot"></span>${escapeHtml(refs.busy)}`;
  }
}

async function loadRepos(index, watch, refs, keepValue) {
  /* A cached board can be on screen before sign-in finishes; there is
     nothing to look up yet and no error worth showing. */
  if (!app.token) return;
  const gen = ++refs.gen.repos;
  refs.busy = 'Loading repositories…'; refs.err = ''; paintRowNote(refs);
  try {
    const names = await listRepos(watch.org);
    if (refs.gen.repos !== gen) return;
    refs.repoCombo.setOptions(names);
    if (keepValue) refs.repoCombo.setValue(watch.repo);
  } catch (e) {
    if (refs.gen.repos !== gen) return;
    /* Can't enumerate (common with fine-grained tokens) - typing the exact
       repository name still works, so this is a hint, not an error. */
    refs.repoCombo.setPlaceholder('Repository (type the exact name)');
  }
  if (refs.gen.repos === gen) { refs.busy = ''; paintRowNote(refs); }
}

async function loadBranches(index, watch, refs, keepValue) {
  /* A cached board can be on screen before sign-in finishes; there is
     nothing to look up yet and no error worth showing. */
  if (!app.token) return;
  const gen = ++refs.gen.branches;
  refs.busy = 'Loading branches…'; refs.err = ''; paintRowNote(refs);
  refs.branchCombo.setDisabled(false);
  try {
    const names = await listBranches(watch.org, watch.repo);
    if (refs.gen.branches !== gen) return;
    refs.branchCombo.setOptions(names);
    if (keepValue) refs.branchCombo.setValue(watch.branch);
    else if (!watch.branch) {
      /* Pre-select a sensible default so a new row is one click from useful. */
      const preferred = ['develop', 'main', 'master'].find(n => names.includes(n));
      if (preferred) { refs.branchCombo.setValue(preferred); watch.branch = preferred; saveConfig(); }
    }
  } catch (e) {
    if (refs.gen.branches !== gen) return;
    refs.err = e.status === 404
      ? `Can't read ${watch.org}/${watch.repo} - check the name, or that your token has access.`
      : e.message;
  }
  if (refs.gen.branches === gen) { refs.busy = ''; paintRowNote(refs); }
}

/* ── Toolbar ────────────────────────────────────────────────────────────────
   Built once, then updated in place: a timed background refresh must not
   rebuild the search box out from under someone who is typing in it.        */
function buildToolbar() {
  const t = ui.toolbar;
  if (!t) return;
  t.innerHTML = '';
  t.className = 'action-bar';

  /* Display toggles: these change what the fetched data looks like, so they
     belong with the other controls that act on it rather than among the
     settings that decide what is fetched. */
  const toggles = document.createElement('div');
  toggles.className = 'action-group';
  toggles.innerHTML = `
    <label class="opt"><input type="checkbox" id="opt-stacked" />
      Include stacked PRs
      <span class="hint" title="A stacked PR targets another PR's branch rather than the watched branch. With this on, the whole chain is followed. Applies to open PRs.">?</span>
    </label>
    <label class="opt"><input type="checkbox" id="opt-drafts" /> Hide drafts</label>`;
  const oS = toggles.querySelector('#opt-stacked');
  const oR = toggles.querySelector('#opt-drafts');
  oS.checked = config.includeStacked;
  oR.checked = config.hideDrafts;
  /* Stacked PRs are resolved while fetching, so this one needs a refresh to
     take effect; hiding drafts is a render-time filter and does not. */
  oS.addEventListener('change', () => {
    config.includeStacked = oS.checked; saveConfig(); scheduleRefetch();
  });
  oR.addEventListener('change', () => {
    config.hideDrafts = oR.checked; saveConfig(); paintResults();
  });
  t.appendChild(toggles);

  const spacer = document.createElement('div');
  spacer.className = 'spacer';
  t.appendChild(spacer);

  const status = document.createElement('div');
  status.className = 'action-group';
  t.appendChild(status);

  const progress = document.createElement('span');
  progress.className = 'muted';
  progress.id = 'gh-refresh-progress';
  progress.setAttribute('role', 'status');
  status.appendChild(progress);
  ui.progress = progress;

  const stamp = document.createElement('span');
  stamp.className = 'muted';
  status.appendChild(stamp);
  ui.stamp = stamp;

  const autoStatus = document.createElement('span');
  autoStatus.className = 'muted';
  status.appendChild(autoStatus);
  ui.autoStatus = autoStatus;

  const buttons = document.createElement('div');
  buttons.className = 'action-group';
  t.appendChild(buttons);

  const collapse = document.createElement('button');
  collapse.className = 'btn-sm';
  collapse.id = 'btn-collapse-all';
  collapse.addEventListener('click', () => {
    const keys = results.map(r => r.key);
    const anyOpen = keys.some(k => !config.collapsed[k]);
    keys.forEach(k => { if (anyOpen) config.collapsed[k] = true; else delete config.collapsed[k]; });
    saveConfig();
    paintResults();
    paintToolbar();
  });
  buttons.appendChild(collapse);
  ui.collapseBtn = collapse;

  const csv = document.createElement('button');
  csv.className = 'btn-sm';
  csv.textContent = 'Export CSV';
  csv.addEventListener('click', exportCsv);
  buttons.appendChild(csv);
  ui.csvBtn = csv;

  const share = document.createElement('button');
  share.className = 'btn-sm';
  share.textContent = 'Copy link';
  share.title = 'Copy a link that reproduces this exact configuration';
  share.addEventListener('click', () => {
    const encoded = encodeConfig(config);
    const url = location.origin + location.pathname + '#c=' + encoded;
    /* Claim the hash as already imported before it can ever be read back.

       Copying a link used to plant `#c=` in the sharer's own address bar and
       leave it there. `loadConfig` would then find, on the next reload, a hash
       it had no record of importing, adopt it, and overwrite everything the
       sharer had changed since - with a toast telling them settings had been
       loaded from a link they never opened. Recording it here is what makes the
       one-shot-import rule cover the sharer as well as the recipient. */
    store.set(IMPORTED_KEY, encoded);
    copyText(url).then(
      () => toast('Shareable link copied. It carries the settings, never your token.'),
      () => {
        /* Only now is the address bar worth using: it is the one place left to
           read the link from. Throws on a file:// page, which is survivable. */
        try { history.replaceState(null, '', '#c=' + encoded); } catch (e) { /* ignore */ }
        toast('Could not copy. The link is now in the address bar.');
      }
    );
  });
  buttons.appendChild(share);

  const sel = document.createElement('select');
  sel.id = 'filter-interval';
  sel.className = 'mini-select';
  /* No "whatever was stored" entry any more: `migrateConfig` snaps the value to
     this list, so anything outside it cannot reach here. */
  AUTO_INTERVALS.forEach(sec => {
    const o = document.createElement('option');
    o.value = String(sec);
    o.textContent = autoLabel(sec);
    if (sec === config.autoRefreshSec) o.selected = true;
    sel.appendChild(o);
  });
  sel.title = 'How often to re-poll GitHub while this tab is open';
  sel.setAttribute('aria-label', 'Automatic refresh interval');
  sel.addEventListener('change', () => {
    config.autoRefreshSec = Number(sel.value) || 0;
    saveConfig();
    startAutoRefresh();
  });
  buttons.appendChild(sel);

  buttons.appendChild(buildRefreshSplitButton());

  paintToolbar();
}

function paintToolbar() {
  if (!ui.refreshBtn) return;
  const busy = app.loading || app.connecting;
  ui.refreshBtn.innerHTML = busy
    ? `<span class="spinner"></span> ${app.connecting ? 'Signing in…' : 'Refreshing…'}`
    : '↻ Refresh';
  ui.refreshBtn.disabled = busy;
  if (ui.refreshCaret) ui.refreshCaret.disabled = busy;
  if (busy) closeRefreshMenu();
  if (ui.progress) {
    ui.progress.textContent = (app.loading && app.refreshTotal > 1)
      ? `repository ${app.refreshIndex} of ${app.refreshTotal}`
      : '';
  }
  ui.csvBtn.disabled = !results.some(r => r.prs.length);
  if (ui.progress && app.connecting) ui.progress.textContent = '';
  /* While a cold refresh runs over restored rows, say so: the table is
     showing real data, just not current data. */
  if (app.lastRefresh && !app.loading) {
    ui.stamp.textContent = 'Updated ' + app.lastRefresh.toLocaleTimeString();
    ui.stamp.title = '';
  } else if (app.snapshotAt) {
    ui.stamp.textContent = `saved results from ${relTime(app.snapshotAt.toISOString())}`;
    ui.stamp.title = 'Rows below are from the last completed refresh, kept in this browser. They are replaced as fresh data arrives.';
  } else {
    ui.stamp.textContent = '';
    ui.stamp.title = snapshotNote ? 'Saved results: ' + snapshotNote : '';
  }
  if (ui.collapseBtn) {
    const keys = results.map(r => r.key);
    ui.collapseBtn.style.display = keys.length > 1 ? '' : 'none';
    ui.collapseBtn.textContent = keys.some(k => !config.collapsed[k]) ? 'Collapse all' : 'Expand all';
  }
  paintFilterChips();
  paintAutoStatus();
}

/* ── Refresh, with its variants behind a caret ─────────────────────────────
   Reviews of merged pull requests are cached, so the everyday refresh skips
   them. Discarding that cache is the same action with one cache cleared
   first, which makes it a variant of Refresh rather than a separate button.
   Choosing a variant runs it once; the default is not changed. */
const REFRESH_ACTIONS = [
  {
    label: 'Refresh',
    note: 'Re-fetch everything, reusing the cached reviews of merged pull requests.',
    run() { refreshAll(); },
  },
  {
    label: 'Refetch merged reviews',
    note: 'Also discard those cached reviews. Use it when a review was added or dismissed after a merge. Costs one extra request per merged pull request.',
    run() {
      reviewCache = {};
      store.del(REVIEWS_KEY);
      toast('Cached review data cleared - refetching.');
      refreshAll();
    },
  },
];

function buildRefreshSplitButton() {
  const wrap = document.createElement('div');
  wrap.className = 'split-btn';

  const main = document.createElement('button');
  main.className = 'btn-primary split-main';
  main.addEventListener('click', () => { closeRefreshMenu(); refreshAll(); });

  const caret = document.createElement('button');
  caret.className = 'btn-primary split-caret';
  caret.textContent = '▾';
  caret.setAttribute('aria-haspopup', 'menu');
  caret.setAttribute('aria-expanded', 'false');
  caret.setAttribute('aria-label', 'Other refresh options');
  caret.title = 'Other refresh options';

  const menu = document.createElement('div');
  menu.className = 'split-menu';
  menu.setAttribute('role', 'menu');

  REFRESH_ACTIONS.forEach(action => {
    const item = document.createElement('button');
    item.className = 'split-item';
    item.type = 'button';
    item.setAttribute('role', 'menuitem');
    item.innerHTML = `${escapeHtml(action.label)}<span class="note">${escapeHtml(action.note)}</span>`;
    item.addEventListener('click', () => { closeRefreshMenu(); action.run(); });
    menu.appendChild(item);
  });

  caret.addEventListener('click', e => {
    e.stopPropagation();
    menu.classList.contains('is-open') ? closeRefreshMenu() : openRefreshMenu();
  });
  menu.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeRefreshMenu(); caret.focus(); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const items = [...menu.querySelectorAll('.split-item')];
    const at = items.indexOf(document.activeElement);
    const next = e.key === 'ArrowDown' ? at + 1 : at - 1;
    items[(next + items.length) % items.length].focus();
  });

  wrap.append(main, caret, menu);
  ui.refreshBtn = main;
  ui.refreshCaret = caret;
  ui.refreshMenu = menu;
  return wrap;
}

/* The outside-click handler only exists while the menu is open, so there is
   nothing left on the document to leak when the panel is rebuilt. */
let refreshMenuAway = null;
function openRefreshMenu() {
  const { refreshMenu: menu, refreshCaret: caret } = ui;
  if (!menu) return;
  menu.classList.add('is-open');
  caret.setAttribute('aria-expanded', 'true');
  const first = menu.querySelector('.split-item');
  if (first) first.focus();
  refreshMenuAway = e => { if (!menu.parentNode.contains(e.target)) closeRefreshMenu(); };
  document.addEventListener('mousedown', refreshMenuAway);
}
function closeRefreshMenu() {
  const { refreshMenu: menu, refreshCaret: caret } = ui;
  if (menu) menu.classList.remove('is-open');
  if (caret) caret.setAttribute('aria-expanded', 'false');
  if (refreshMenuAway) { document.removeEventListener('mousedown', refreshMenuAway); refreshMenuAway = null; }
}

/* ══════════════════════════════════════════════════════════════════════════
   Filters

   Typed as `field: value`, held as removable chips. One chip per field, so
   re-entering a field replaces it rather than silently ANDing two values
   together - `author: a` and `author: b` at once would always match nothing.
   ══════════════════════════════════════════════════════════════════════════ */
function addFilter(field, value) {
  const f = String(field || '').trim().toLowerCase();
  const v = String(value || '').trim();
  if (!FILTER_FIELDS.includes(f) || !v) return false;
  const existing = config.filters.find(x => x.field === f);
  if (existing) existing.value = v;
  else config.filters.push({ field: f, value: v });
  saveConfig();
  paintFilterChips();
  paintResults();
  return true;
}

function removeFilter(field) {
  config.filters = config.filters.filter(f => f.field !== field);
  saveConfig();
  paintFilterChips();
  paintResults();
}

function paintFilterChips() {
  const field = ui.filterField;
  const input = ui.filterInput;
  if (!field || !input) return;
  field.querySelectorAll('.gh-token').forEach(el => el.remove());
  config.filters.forEach(f => {
    const chip = document.createElement('span');
    chip.className = 'gh-token is-include';
    chip.dataset.field = f.field;
    const x = document.createElement('button');
    x.className = 'gh-token-x';
    x.type = 'button';
    x.textContent = '×';
    x.title = `Remove the ${f.field} filter`;
    x.setAttribute('aria-label', `Remove the ${f.field} filter`);
    x.addEventListener('click', () => removeFilter(f.field));
    const text = document.createElement('span');
    text.innerHTML = `<span class="filter-chip-field">${escapeHtml(f.field)}:</span> ${escapeHtml(f.value)}`;
    chip.append(x, text);
    field.appendChild(chip);              // chips follow the box, wrapping under it
  });
  input.placeholder = 'Add a filter - e.g. author: bthomee';
}

/* Every value present in the fetched data for a field. `title` is unbounded,
   so it gets no suggestions. */
function observedValues(field) {
  if (field === 'title') return [];
  const set = new Set();
  results.forEach(r => r.prs.forEach(pr => {
    switch (field) {
      case 'author':
        if (pr.user && pr.user.login) set.add(pr.user.login);
        break;
      case 'reviewer': {
        const rv = pr.reviewers || {};
        ['approved', 'changes', 'commented', 'pending', 'dismissed']
          .forEach(k => (rv[k] || []).forEach(l => set.add(l)));
        break;
      }
      case 'status':
        if (pr.status) set.add(pr.status);
        break;
      case 'label':
        (pr.labels || []).forEach(l => {
          const n = typeof l === 'string' ? l : l.name;
          if (n) set.add(n);
        });
        break;
      case 'milestone':
        set.add(pr.milestone && pr.milestone.title ? pr.milestone.title : NO_VALUE);
        break;
    }
  }));
  return [...set].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
}

/* Split what has been typed into a field part and a value part. */
function parseFilterInput(raw) {
  const m = /^\s*([^:]*?)\s*:\s*([\s\S]*)$/.exec(raw);
  if (!m) return { field: null, fieldText: raw.trim(), value: '' };
  return { field: m[1].trim().toLowerCase(), fieldText: m[1].trim(), value: m[2] };
}

function filterSuggestions(raw) {
  const { field, fieldText, value } = parseFilterInput(raw);
  if (field === null) {
    /* Still naming the field. */
    const q = fieldText.toLowerCase();
    return FILTER_FIELDS
      .filter(f => f.startsWith(q))
      .map(f => ({ kind: 'field', text: f, insert: f + ': ', label: f + ':' }));
  }
  if (!FILTER_FIELDS.includes(field)) return [];
  /* Ignore any quotes already typed so suggestions keep working while the
     value is being edited. */
  const q = value.trim().replace(/^"+|"+$/g, '').toLowerCase();
  return observedValues(field)
    .filter(v => v.toLowerCase().includes(q))
    .slice(0, 60)
    .map(v => ({ kind: 'value', text: v, insert: `${field}: "${v}"`, label: v }));
}

function wireFilterInput(input, drop) {
  let items = [];
  let active = -1;

  const close = () => { drop.style.display = 'none'; drop.innerHTML = ''; items = []; active = -1; };

  const render = () => {
    items = filterSuggestions(input.value);
    drop.innerHTML = '';
    if (!items.length || document.activeElement !== input) { drop.style.display = 'none'; return; }
    if (active >= items.length) active = items.length - 1;
    items.forEach((it, i) => {
      const li = document.createElement('li');
      li.className = 'filter-opt' + (i === active ? ' active' : '');
      li.innerHTML = it.kind === 'field'
        ? `<span class="filter-opt-field">${escapeHtml(it.label)}</span>`
        : escapeHtml(it.label);
      li.addEventListener('mousedown', e => { e.preventDefault(); choose(i); });
      drop.appendChild(li);
    });
    drop.style.display = 'block';
  };

  const choose = (i) => {
    const it = items[i];
    if (!it) return;
    input.value = it.insert;
    if (it.kind === 'value') { submit(); return; }
    render();                     // field chosen: now suggest its values
  };

  const submit = () => {
    const { field, value } = parseFilterInput(input.value);
    if (field === null || !FILTER_FIELDS.includes(field)) {
      /* Typing a fragment of a title and pressing Enter is the most obvious
         thing to try, and it used to flash red and list six field names. Since
         `title` is the only unbounded field, plain text can only sensibly mean
         that - so treat it as a title search rather than an error. A string
         that does contain a colon but names no real field is still a mistake
         worth pointing out, because it was probably meant as `field: value`. */
      const bare = input.value.trim();
      if (bare && field === null && addFilter('title', bare)) {
        input.value = '';
        close();
        return;
      }
      flashInvalid(input);
      return;
    }
    if (!value.trim()) { render(); return; }   // field only: keep suggesting
    if (addFilter(field, value)) { input.value = ''; close(); }
  };

  input.addEventListener('input', () => { active = -1; render(); });
  input.addEventListener('focus', render);
  input.addEventListener('blur', () => setTimeout(close, 120));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) { active = (active + 1) % items.length; render(); } return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); if (items.length) { active = (active - 1 + items.length) % items.length; render(); } return; }
    if (e.key === 'Tab') {
      /* Tab completes rather than submits, so a value can still be edited. */
      if (items.length) {
        e.preventDefault();
        const i = active >= 0 ? active : 0;
        input.value = items[i].insert;
        active = -1;
        /* Re-render either way: after a field it suggests that field's values,
           after a value it narrows to the completed text. */
        render();
      }
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (active >= 0 && items[active]) choose(active);
      else submit();
      return;
    }
    if (e.key === 'Escape') { close(); input.blur(); }
  });
}

function flashInvalid(el) {
  const target = ui.filterInput || el;
  target.classList.add('is-invalid');
  setTimeout(() => target.classList.remove('is-invalid'), 900);
  toast('Filter must be one of: ' + FILTER_FIELDS.join(', ') + ' - e.g. "author: bthomee"');
}


/* ── Results ────────────────────────────────────────────────────────────── */
/* A value wrapped in double quotes means exactly that value; bare text is a
   substring match. Picking from the suggestion list inserts the quoted form,
   because choosing "3.4.0" from a list of real milestones plainly means that
   milestone and not also "3.4.0 (tests)". Typing stays loose, so a partial
   title or a half-remembered login still finds things. */
function prMatchesFilter(pr, f) {
  const raw = String(f.value || '').trim();
  if (!raw) return true;
  const exact = raw.length >= 2 && raw.startsWith('"') && raw.endsWith('"');
  const v = (exact ? raw.slice(1, -1) : raw).toLowerCase();
  if (!v) return true;
  const has = x => {
    const t = String(x === null || x === undefined ? '' : x).toLowerCase();
    return exact ? t === v : t.includes(v);
  };
  switch (f.field) {
    case 'title':
      return has(pr.title) || has('#' + pr.number);
    case 'author':
      return has(pr.user && pr.user.login);
    case 'status':
      return has(pr.status);
    case 'label':
      return (pr.labels || []).some(l => has(typeof l === 'string' ? l : l.name));
    case 'milestone': {
      const t = (pr.milestone && pr.milestone.title) || '';
      if (v === NO_VALUE.toLowerCase() || v === 'none') return !t;
      return has(t);
    }
    case 'reviewer': {
      const rv = pr.reviewers || {};
      return ['approved', 'changes', 'commented', 'pending', 'dismissed']
        .some(k => (rv[k] || []).some(has));
    }
  }
  return true;
}

function visiblePrs(r) {
  return r.prs.filter(pr => {
    if (config.hideDrafts && pr.draft) return false;
    return config.filters.every(f => prMatchesFilter(pr, f));
  });
}

function describeFilters() {
  return config.filters.map(f => `${f.field}: ${f.value}`).join(', ');
}

function paintResults() {
  paintStats();
  const c = ui.results;
  if (!c) return;
  c.innerHTML = '';

  const configured = config.watches.filter(w => w.org && w.repo && w.branch);
  if (!configured.length) {
    c.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <div class="title">Nothing being watched yet</div>
        <div class="sub">Pick an owner, a repository and the base branch you care about above, then hit Refresh. Add as many rows as you like: each one gets its own section below, so you can follow <code>develop</code> and a <code>staging/x.y.z</code> release branch on one page.</div>
      </div>`;
    return;
  }

  if (!results.length) {
    c.innerHTML = `
      <div class="empty-state">
        <div class="icon">↻</div>
        <div class="title">Ready when you are</div>
        <div class="sub">Hit Refresh to pull the current pull requests for the ${configured.length} branch${configured.length === 1 ? '' : 'es'} above.</div>
      </div>`;
    return;
  }

  results.forEach(r => c.appendChild(buildGroup(r)));
}

function buildGroup(r) {
  const g = document.createElement('div');
  g.className = 'group';

  const shown = visiblePrs(r);
  const openCount   = shown.filter(p => !p.merged_at).length;
  const mergedCount = shown.filter(p => !!p.merged_at).length;

  const head = document.createElement('div');
  head.className = 'group-head';
  /* Path segments are encoded and the finished URL is escaped before it goes
     anywhere near an href attribute: org and repo can arrive from a shared
     link, and an unescaped quote there is a script-injection point. */
  const prListUrl = `https://github.com/${seg(r.org)}/${seg(r.repo)}/pulls?q=` +
    encodeURIComponent(`is:pr is:open base:${r.branch}`);
  const collapsed = !!config.collapsed[r.key];
  const stacked = shown.filter(p => p.stackDepth > 0).length;
  head.innerHTML = `
    <button class="group-toggle" type="button" aria-expanded="${collapsed ? 'false' : 'true'}"
            title="${collapsed ? 'Expand' : 'Collapse'} this repository">${collapsed ? '▸' : '▾'}</button>
    <a class="group-title no-underline" href="https://github.com/${seg(r.org)}/${seg(r.repo)}" target="_blank" rel="noopener">${escapeHtml(r.org)}/${escapeHtml(r.repo)}</a>
    <span class="t-faint">→</span>
    <span class="group-branch">${escapeHtml(r.branch)}</span>
    ${r.cutoffLabel ? `<span class="cutoff-chip" title="How much history this branch pulls in">${escapeHtml(r.cutoffLabel)}</span>` : ''}
    ${r.truncated ? `<span class="trunc-chip" title="GitHub paging stopped at this tool's limit, so older items are not shown">⚠ showing ${escapeHtml(r.truncated)}</span>` : ''}
    ${r.mergeQueueError ? `<span class="trunc-chip" title="${escapeHtml(r.mergeQueueError)}">⚠ merge-queue state unavailable</span>` : ''}
    <div class="grow"></div>
    ${r.loading ? '<span class="spinner" title="Refreshing - the list below stays until the new data is ready"></span><span class="group-progress"></span>' : ''}
    <span class="group-count">${openCount} open · ${mergedCount} merged${stacked ? ` · ${stacked} stacked` : ''}</span>
    <a class="btn-sm no-underline" href="${escapeHtml(prListUrl)}" target="_blank" rel="noopener">Open on GitHub ↗</a>`;

  const toggle = () => {
    if (config.collapsed[r.key]) delete config.collapsed[r.key];
    else config.collapsed[r.key] = true;
    saveConfig();
    paintResults();
    paintToolbar();
  };
  /* Hand setProgress live nodes to write into, so per-pull-request updates
     cost a textContent write rather than a full repaint. */
  if (r.loading) {
    r._progressEl = head.querySelector('.group-progress');
    if (r._progressEl) r._progressEl.textContent = progressLabel(r);
    const bar = document.createElement('div');
    bar.className = 'group-bar';
    const pct = r.progressTotal > 0 ? Math.min(100, Math.round((r.progressDone / r.progressTotal) * 100)) : 0;
    bar.style.width = pct + '%';
    head.appendChild(bar);
    r._progressBar = bar;
  } else {
    r._progressEl = null;
    r._progressBar = null;
  }

  head.querySelector('.group-toggle').addEventListener('click', toggle);
  head.addEventListener('click', e => {
    /* Anywhere on the bar except the links toggles it. */
    if (e.target.closest('a') || e.target.closest('.group-toggle')) return;
    /* Now that the names in the bar are selectable, releasing the mouse at the
       end of a selection must not also collapse the group. */
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && head.contains(sel.anchorNode)) return;
    toggle();
  });
  if (collapsed) head.classList.add('collapsed');
  g.appendChild(head);

  if (collapsed) return g;

  const body = document.createElement('div');
  body.className = 'group-body';

  if (r.error) {
    body.innerHTML = `<div class="err-wrap"><div class="err-banner m0"><strong>Couldn't load this one.</strong> ${escapeHtml(r.error)}</div></div>`;
    g.appendChild(body);
    return g;
  }

  /* A staging branch that hasn't been cut yet - normal mid-cycle, so say so
     rather than showing an empty table that looks like a failure. */
  if (r.branchMissing) {
    body.innerHTML = `<div class="pad-note is-info">
      Branch <code>${escapeHtml(r.branch)}</code> doesn't exist in this repository yet - nothing to track until it's created.</div>`;
    g.appendChild(body);
    return g;
  }

  if (r.loading && !r.prs.length) {
    body.innerHTML = `<div class="pad-note">Loading pull requests…</div>`;
    g.appendChild(body);
    return g;
  }

  if (!shown.length) {
    let why;
    if (!r.prs.length) {
      why = 'No pull requests found for this branch.';
    } else if (config.filters.length) {
      why = `${r.prs.length} pull request${r.prs.length === 1 ? '' : 's'} here, but none match <strong class="t-dim">${escapeHtml(describeFilters())}</strong>.`;
    } else if (config.hideDrafts) {
      why = `${r.prs.length} pull request${r.prs.length === 1 ? '' : 's'} here, all of them drafts.`;
    } else {
      why = 'Nothing matches the current filters.';
    }
    body.innerHTML = `<div class="pad-note">${why}</div>`;
    g.appendChild(body);
    return g;
  }

  const table = document.createElement('table');
  table.innerHTML = `
    <thead><tr>
      <th class="col-pr">Pull request</th>
      <th class="col-author">Author</th>
      <th class="col-rev">Reviewers</th>
      <th class="col-labels">Labels</th>
      <th class="col-status">Status</th>
    </tr></thead>`;
  const tbody = document.createElement('tbody');
  shown.forEach(pr => tbody.appendChild(buildRow(pr, r)));
  table.appendChild(tbody);
  body.appendChild(table);
  g.appendChild(body);
  return g;
}

function buildRow(pr, r) {
  const tr = document.createElement('tr');
  tr.className = 'pr-row';

  /* Escaped once here; both hrefs below interpolate it as-is. */
  const url = escapeHtml(pr.html_url || `https://github.com/${seg(r.org)}/${seg(r.repo)}/pull/${pr.number}`);
  const when = pr.merged_at
    ? 'merged ' + relTime(pr.merged_at)
    : 'updated ' + relTime(pr.updated_at || pr.created_at);

  /* Pull request */
  const tdPr = document.createElement('td');
  tdPr.className = 'col-pr';
  const depth = pr.stackDepth || 0;
  tdPr.style.paddingLeft = depth ? `${0.875 + depth}rem` : '';
  tdPr.innerHTML = `
    ${depth ? `<span class="stack-mark" title="Stacked on #${pr.stackParent} - targets that PR's branch, not ${escapeHtml(r.branch)}">↳</span>` : ''}
    <a class="pr-title" href="${url}" target="_blank" rel="noopener">${escapeHtml(stripPrSuffix(pr.title))}</a>
    <div class="pr-meta">
      <a class="pr-num" href="${url}" target="_blank" rel="noopener">#${pr.number}</a>
      ${pr.draft ? '<span class="draft-tag">Draft</span>' : ''}
      <span>${when}</span>
      ${pr.milestone && pr.milestone.title ? `<span title="Milestone">🎯 ${escapeHtml(pr.milestone.title)}</span>` : ''}
      ${depth ? `<span class="stack-tag" title="Base branch: ${escapeHtml((pr.base && pr.base.ref) || '')}">stacked on #${pr.stackParent}</span>` : ''}
    </div>`;
  tr.appendChild(tdPr);

  /* Author */
  const tdAuthor = document.createElement('td');
  tdAuthor.className = 'col-author';
  const author = pr.user && pr.user.login;
  tdAuthor.innerHTML = author
    ? `<a class="handle" href="https://github.com/${encodeURIComponent(author)}" target="_blank" rel="noopener">${escapeHtml(author)}</a>`
    : '<span class="muted">–</span>';
  tr.appendChild(tdAuthor);

  /* Reviewers */
  const tdRev = document.createElement('td');
  tdRev.className = 'col-rev';
  tdRev.appendChild(buildReviewerCell(pr));
  tr.appendChild(tdRev);

  /* Labels */
  const tdLabels = document.createElement('td');
  tdLabels.className = 'col-labels';
  const labels = (pr.labels || []).filter(l => l && (typeof l === 'string' ? l : l.name));
  if (!labels.length) {
    tdLabels.innerHTML = '<span class="muted">–</span>';
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    labels.forEach(l => {
      const name = typeof l === 'string' ? l : l.name;
      const hex  = (typeof l === 'object' && l.color) ? l.color : '64748b';
      const a = document.createElement('a');
      a.className = 'chip chip-label';
      a.href = `https://github.com/${seg(r.org)}/${seg(r.repo)}/labels/${encodeURIComponent(name)}`;
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = name;
      a.title = (typeof l === 'object' && l.description) ? l.description : name;
      /* Use the label's own GitHub colour, muted for a dark background. */
      a.style.background   = `#${hex}1f`;
      a.style.color        = lightenForDark(hex);
      a.style.borderColor  = `#${hex}55`;
      wrap.appendChild(a);
    });
    tdLabels.appendChild(wrap);
  }
  tr.appendChild(tdLabels);

  /* Status */
  const tdStatus = document.createElement('td');
  tdStatus.className = 'col-status';
  const meta = STATUS_META[pr.status] || { color: 'var(--text-dim)' };
  const why = pr.status === 'Queued' ? queuedReason(pr) : '';
  /* Built as nodes rather than markup so the colour goes through `element.style`.
     A `style` attribute in an innerHTML template is what forces the policy to
     allow `style-src 'unsafe-inline'` for the whole page; the CSSOM is not
     restricted by CSP at all, and the value here changes per row. */
  const status = document.createElement('span');
  status.className = 'status';
  status.style.color = meta.color;
  if (why) status.title = why;
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = meta.color;
  status.append(dot, document.createTextNode(pr.status));
  tdStatus.appendChild(status);
  tr.appendChild(tdStatus);

  return tr;
}

/* Approved / changes-requested / commented / still-invited, as distinct rows
   of chips so "asked" and "answered" are never confused. */
function buildReviewerCell(pr) {
  const rv = pr.reviewers || { approved: [], changes: [], commented: [], pending: [], dismissed: [] };
  const wrap = document.createElement('div');

  if (pr.reviewError) {
    wrap.innerHTML = `<span class="muted" title="${escapeHtml(pr.reviewError)}">reviews unavailable</span>`;
    return wrap;
  }

  const groups = [
    { list: rv.approved,  cls: 'chip-approved',  ico: '✓', tip: 'Approved' },
    { list: rv.changes,   cls: 'chip-changes',   ico: '✋', tip: 'Requested changes' },
    { list: rv.commented, cls: 'chip-commented', ico: '💬', tip: 'Commented, no verdict yet' },
    { list: rv.pending,   cls: 'chip-pending',   ico: '⏳', tip: 'Invited, not responded yet' },
    { list: rv.dismissed, cls: 'chip-dismissed', ico: '⊘', tip: 'Review dismissed' },
  ];

  let any = false;
  groups.forEach(gr => {
    if (!gr.list.length) return;
    any = true;
    const line = document.createElement('div');
    line.className = 'rev-group chips';
    gr.list.forEach(login => {
      const isTeam = login.startsWith('@');
      /* A team has no user page to link to, so it is not a link. `href="#"`
         looked the same but scrolled the board to the top and pushed a history
         entry on every click. */
      const el = document.createElement(isTeam ? 'span' : 'a');
      el.className = 'chip ' + gr.cls;
      if (!isTeam) {
        el.href = `https://github.com/${encodeURIComponent(login)}`;
        el.target = '_blank';
        el.rel = 'noopener';
      }
      el.title = `${gr.tip}: ${login}`;
      el.innerHTML = `<span class="ico">${gr.ico}</span>${escapeHtml(login)}`;
      line.appendChild(el);
    });
    wrap.appendChild(line);
  });

  if (!any) {
    wrap.innerHTML = pr.merged_at
      ? '<span class="muted">no recorded reviews</span>'
      : '<span class="muted">no reviewers yet</span>';
  }
  return wrap;
}

/* ── Stats ──────────────────────────────────────────────────────────────── */
function paintStats() {
  const s = ui.stats;
  if (!s) return;
  /* One entry per pull request even when two watched rows both surface it,
     so the totals cannot be inflated by overlapping rows. */
  const seenPr = new Set();
  const all = [];
  results.forEach(r => visiblePrs(r).forEach(pr => {
    const key = `${r.org}/${r.repo}#${pr.number}`;
    if (seenPr.has(key)) return;
    seenPr.add(key);
    all.push(pr);
  }));
  if (!all.length) { s.innerHTML = ''; return; }

  const open = all.filter(p => !p.merged_at);
  const byStatus = st => open.filter(p => p.status === st).length;
  const colour = st => (STATUS_META[st] || {}).color || 'var(--text-dim)';

  /* Every open-PR column keys off `status`, which holds exactly one value per
     pull request, so these buckets are disjoint by construction. The previous
     "No approval yet" was computed independently of status and counted every
     changes-requested PR a second time.

     Note they do not sum to Open: a Draft, or an approved PR not yet labelled
     or queued, sits in none of them. Each cell says what it counts. */
  const cells = [
    { v: open.length,                   l: 'Open',              c: 'var(--text)',
      t: 'Open pull requests matching the current filters.' },
    { v: byStatus('In Review'),         l: 'No approval yet',   c: colour('In Review'),
      t: 'Open, nobody has approved yet, and no changes are requested. Does not overlap the columns to its right.' },
    { v: byStatus('Changes Requested'), l: 'Changes requested', c: colour('Changes Requested'),
      t: 'At least one reviewer asked for changes.' },
    { v: byStatus('Ready to Merge'),    l: 'Ready to Merge',    c: colour('Ready to Merge'),
      t: `Carrying the "${READY_LABEL}" label.` },
    { v: byStatus('Queued'),            l: 'Queued',            c: colour('Queued'),
      t: 'Waiting to land on its own: in the merge queue, or auto-merge is enabled.' },
    { v: all.length - open.length,      l: 'Merged',            c: colour('Merged'),
      t: 'Merged inside the range each watched row is set to.' },
  ];
  /* Nodes, not markup: each cell's colour is per-status, and a `style`
     attribute in a template is what would force `style-src 'unsafe-inline'`. */
  s.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'stats-bar';
  cells.forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'stat-cell';
    cell.title = c.t;
    const val = document.createElement('div');
    val.className = 'stat-val';
    val.style.color = c.c;
    val.textContent = c.v;
    const lbl = document.createElement('div');
    lbl.className = 'stat-lbl';
    lbl.textContent = c.l;
    cell.append(val, lbl);
    bar.appendChild(cell);
  });
  s.appendChild(bar);
}

/* ══════════════════════════════════════════════════════════════════════════
   Export / helpers
   ══════════════════════════════════════════════════════════════════════════ */
function exportCsv() {
  const rows = [[
    'Repository', 'Branch', 'PR', 'Number', 'URL', 'Author', 'Status',
    'Approved by', 'Changes requested by', 'Commented', 'Awaiting review from',
    'Labels', 'Milestone', 'Merged at', 'Updated at', 'Range', 'Stacked on', 'Queued because',
  ]];
  results.forEach(r => visiblePrs(r).forEach(pr => {
    const rv = pr.reviewers || { approved: [], changes: [], commented: [], pending: [] };
    rows.push([
      `${r.org}/${r.repo}`, r.branch, stripPrSuffix(pr.title), pr.number,
      pr.html_url || '', (pr.user && pr.user.login) || '', pr.status,
      rv.approved.join(', '), rv.changes.join(', '), rv.commented.join(', '), rv.pending.join(', '),
      (pr.labels || []).map(l => typeof l === 'string' ? l : l.name).join(', '),
      pr.milestone ? pr.milestone.title : '',
      pr.merged_at || '', pr.updated_at || '', r.cutoffLabel || '',
      pr.stackParent ? '#' + pr.stackParent : '',
      queuedReason(pr),
    ]);
  }));

  /* `toCsvBlob` neutralises formula triggers as well as quoting. Pull request
     titles, label names, milestone titles and logins all reach these cells, and
     a title is written by anyone who can open a pull request against a watched
     repository - so a cell is not trusted text just because it came from the
     GitHub API. See the note on `csvCell` in gh-common.js. */
  downloadBlob(toCsvBlob(rows), `pr-tracker-${new Date().toISOString().slice(0, 10)}.csv`);
}

/* Raise a GitHub label colour to something legible on a dark background. */
function lightenForDark(hex) {
  const h = String(hex || '').replace('#', '');
  if (h.length !== 6) return 'var(--text-dim)';
  let r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  if (lum < 0.55) {
    const f = 0.55 / Math.max(lum, 0.08);
    r = Math.min(255, Math.round(r * f + 40));
    g = Math.min(255, Math.round(g * f + 40));
    b = Math.min(255, Math.round(b * f + 40));
  }
  return `rgb(${r},${g},${b})`;
}

/* ══════════════════════════════════════════════════════════════════════════
   Init
   ══════════════════════════════════════════════════════════════════════════ */
/* Everything this page owns, torn down when the shared auth signs out. */
function resetPageState() {
  closeRefreshMenu();
  abandonRefresh();
  app.snapshotAt = null;
  stopAutoRefresh();
  document.removeEventListener('visibilitychange', onVisibilityChange);
  window.removeEventListener('pageshow', onPageShow);
  destroyWatchRowCombos();
  results = [];
  openPrCache = new Map();
  mergeQueueCache = new Map();
  Object.keys(ui).forEach(k => delete ui[k]);
}

/* Sign-in, token storage and the token screen live in gh-common.js, so one
   token covers every dashboard in this suite. */
GHAuth.configure({
  icon:  '📋',
  title: 'PR Review Tracker',
  blurb: 'Track open and recently merged pull requests across any number of repositories and branches: authors, who has been asked to review, who has approved, and the labels applied.',
  /* Runs before sign-in even starts. Nothing here touches the network: the
     snapshot is in local storage, so last time's board can be on screen while
     the token is still being checked. */
  onRestore() {
    results = loadSnapshot();
    if (!results.length) return false;
    applyDenylistToResults();      // the snapshot holds unfiltered lists
    showMain();
    return true;
  },

  onConnected() {
    if (importedFromLink) {
      importedFromLink = false;
      toast('Settings loaded from the shared link and saved. Later changes stay yours.');
    }
    /* Either onRestore already built the page, in which case only the parts
       that needed a token are missing, or there was no snapshot and this is
       the first paint. */
    if (ui.configPanel) {
      paintHeaderIdentity();
      paintConfig();               // dropdowns can be populated now
      paintToolbar();
    } else {
      results = loadSnapshot();
      applyDenylistToResults();
      showMain();
    }
    if (config.watches.some(w => w.org && w.repo && w.branch)) refreshAll();
  },
  onDisconnected: resetPageState,
});

config = loadConfig();
GHAuth.start();
</script>
